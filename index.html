<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排班查询 · 上传 Excel 按姓名查排班</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --line:#e4e8ef; --ink:#1f2733;
    --muted:#7a8595; --accent:#2f6fed; --accent-soft:#eaf1ff;
    --work:#2563eb; --rest:#dc2626; --special:#7c3aed; --ok:#16a34a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px}
  header h1{font-size:24px;font-weight:700;letter-spacing:.5px}
  header p{color:var(--muted);margin-top:6px;font-size:14px}
  .sub{font-size:12.5px;color:var(--muted)}
  /* 上传区 */
  .drop{
    margin-top:22px;background:var(--card);border:2px dashed var(--line);
    border-radius:14px;padding:40px 20px;text-align:center;cursor:pointer;
    transition:border-color .2s, background .2s;
  }
  .drop:hover,.drop.dragover{border-color:var(--accent);background:var(--accent-soft)}
  .drop .big{font-size:15px;font-weight:600}
  .drop .small{color:var(--muted);font-size:12.5px;margin-top:6px}
  .drop input{display:none}
  .fileinfo{display:none;margin-top:16px;background:var(--accent-soft);
    border:1px solid #cdddfb;border-radius:10px;padding:12px 16px;font-size:13.5px}
  .fileinfo b{color:var(--accent)}
  /* 查询区 */
  .query{display:none;margin-top:24px}
  .qbar{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
  .qbar .box{flex:1;min-width:240px;position:relative}
  .qbar input{
    width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);
    border-radius:10px;background:var(--card);outline:none;transition:border-color .2s;
  }
  .qbar input:focus{border-color:var(--accent)}
  .qbar button{
    padding:12px 22px;font-size:15px;font-weight:600;color:#fff;background:var(--accent);
    border:none;border-radius:10px;cursor:pointer;transition:opacity .2s;
  }
  .qbar button:hover{opacity:.88}
  .hint{color:var(--muted);font-size:12.5px;margin-top:10px}
  .datalist{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card);
    border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(20,30,60,.08);
    max-height:260px;overflow:auto;display:none;z-index:20}
  .datalist div{padding:9px 14px;font-size:14px;cursor:pointer}
  .datalist div:hover{background:var(--accent-soft)}
  /* 结果 */
  .result{display:none;margin-top:22px}
  .pcard{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;display:flex;flex-wrap:wrap;gap:8px 28px;align-items:center;
  }
  .pcard .name{font-size:20px;font-weight:700}
  .pcard .meta{color:var(--muted);font-size:13.5px}
  .pcard .meta b{color:var(--ink);font-weight:600}
  .stats{margin-left:auto;font-size:13px;color:var(--muted)}
  .stats b{color:var(--ink)}
  .tbl{background:var(--card);border:1px solid var(--line);border-radius:14px;
    margin-top:16px;overflow:hidden}
  .tbl-scroll{overflow-x:auto;max-height:480px;overflow-y:auto}
  table{border-collapse:collapse;width:100%;min-width:640px}
  th,td{padding:10px 12px;font-size:13.5px;text-align:center;border-bottom:1px solid var(--line);
    white-space:nowrap}
  thead th{position:sticky;top:0;background:#f8fafc;font-weight:600;color:#5b6472;z-index:5;
    border-bottom:1px solid var(--line)}
  tbody tr:nth-child(even){background:#fafbfd}
  td.date{text-align:left;color:var(--muted)}
  .code{font-weight:700;font-variant-numeric:tabular-nums}
  .c-work{color:var(--work)}
  .c-rest{color:var(--rest)}
  .c-special{color:var(--special)}
  .chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600}
  .chip-work{background:#e8f0ff;color:var(--work)}
  .chip-rest{background:#fee2e2;color:var(--rest)}
  .chip-special{background:#f1e9ff;color:var(--special)}
  .empty{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:34px;text-align:center;color:var(--muted);margin-top:16px}
  .legend{margin-top:14px;font-size:12px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
  .dot-w{background:var(--work)} .dot-r{background:var(--rest)} .dot-s{background:var(--special)}
  @media (max-width:600px){
    .wrap{padding:18px 12px 40px}
    .qbar .box{min-width:100%}
    .pcard .stats{margin-left:0;width:100%}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>排班查询</h1>
    <p>上传排班表（Excel），输入姓名即可查看该员工每天的排班。</p>
  </header>
  <!-- 上传 -->
  <div class="drop" id="drop">
    <div class="big">点击选择，或把 Excel 文件拖到这里</div>
    <div class="small">支持 .xlsx / .xls / .csv</div>
    <input type="file" id="file" accept=".xlsx,.xls,.csv">
  </div>
  <div class="fileinfo" id="fileinfo"></div>
  <!-- 查询 -->
  <div class="query" id="query">
    <div class="qbar">
      <div class="box">
        <input id="kw" type="text" placeholder="输入姓名查询（支持模糊匹配）" autocomplete="off">
        <div class="datalist" id="datalist"></div>
      </div>
      <button id="btn">查询</button>
    </div>
    <div class="hint" id="hint"></div>
  </div>
  <!-- 结果 -->
  <div class="result" id="result"></div>
  <div class="legend" id="legend">
    <span><i class="dot dot-w"></i>有排班（数字班次）</span>
    <span><i class="dot dot-r"></i>0（休 / 无班）</span>
    <span><i class="dot dot-s"></i>X 类班次（特殊）</span>
  </div>
</div>
<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var state={ people:[], dates:[], weekdays:[], loaded:false };
  // ---- 工具 ----
  function excelSerialToDate(serial){
    if(serial instanceof Date) return new Date(serial.getTime());
    if(typeof serial==="number" && serial>10000){
      // Excel 序列号 -> JS Date（1900 系统，25569 为 1970-01-01 偏移）
      return new Date(Math.round((serial-25569)*86400*1000));
    }
    return null;
  }
  function fmtDate(d){
    if(!d || isNaN(d)) return "";
    var p=function(n){return n<10?"0"+n:""+n};
    return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
  }
  function fmtShort(d){
    if(!d || isNaN(d)) return "";
    var p=function(n){return n<10?"0"+n:""+n};
    return p(d.getMonth()+1)+"/"+p(d.getDate());
  }
  function wdCN(d){return ["日","一","二","三","四","五","六"][d.getDay()];}
  // ---- 解析 ----
  function parseWorkbook(wb){
    var sheet=wb.Sheets[wb.SheetNames[0]];
    var rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:null,raw:true});
    if(!rows || rows.length<3) throw new Error("表内容为空或行数不足");
    // 定位表头行（含"姓名"）与"组别/工号"列
    var headIdx=-1, nameCol=-1, groupCol=-1, idCol=-1;
    for(var r=0;r<Math.min(6,rows.length);r++){
      var row=rows[r]||[];
      for(var c=0;c<row.length;c++){
        var v=row[c];
        if(typeof v==="string" && v.indexOf("姓名")>=0){ headIdx=r; nameCol=c; }
        if(typeof v==="string" && v.indexOf("组别")>=0) groupCol=c;
        if(typeof v==="string" && v.indexOf("工号")>=0) idCol=c;
      }
      if(headIdx>=0) break;
    }
    if(headIdx<0 || nameCol<0){ throw new Error("未找到表头行（缺少“姓名”列）"); }
    var dateRow=rows[headIdx+1]||[];
    // 收集日期列：表头为“星期”开头的列
    var cols=[];
    var headRow=rows[headIdx]||[];
    for(var i=0;i<headRow.length;i++){
      var h=headRow[i];
      if(typeof h==="string" && h.indexOf("星期")>=0){
        cols.push(i);
      }
    }
    if(cols.length===0){
      // 兜底：姓名列之后的所有列
      for(var j=nameCol+1;j<headRow.length;j++) cols.push(j);
    }
    var dates=[], weekdays=[];
    for(var k=0;k<cols.length;k++){
      var c2=cols[k];
      var dv=dateRow[c2];
      var d=excelSerialToDate(dv);
      var wd=null;
      if(typeof headRow[c2]==="string"){
        var m=headRow[c2].match(/星期([一二三四五六日])/);
        if(m) wd=m[1];
      }
      dates.push(d); weekdays.push(wd||(d&&!isNaN(d)?wdCN(d):""));
    }
    // 提取人员
    var people=[];
    for(var r2=headIdx+2;r2<rows.length;r2++){
      var row2=rows[r2]||[];
      var nm=row2[nameCol];
      if(nm===null||nm===undefined||String(nm).trim()==="") continue; // 跳过空行
      var shifts={};
      for(var ci=0;ci<cols.length;ci++){
        var v2=row2[cols[ci]];
        if(v2===null||v2===undefined) continue;
        var key=cols[ci];
        var val=(typeof v2==="number" && v2%1===0)?v2:String(v2).trim();
        shifts[key]= (val==="0" || val===0) ? 0 : val;
      }
      people.push({
        name:String(nm).trim(),
        group:groupCol>=0 && row2[groupCol]!=null?String(row2[groupCol]).trim():"",
        id:idCol>=0 && row2[idCol]!=null?String(row2[idCol]).trim():"",
        cols:cols.slice(),
        shifts:shifts
      });
    }
    if(people.length===0) throw new Error("未解析到任何人员数据");
    state.people=people; state.dates=dates; state.weekdays=weekdays; state.loaded=true;
    return people.length;
  }
  function renderCellClass(code){
    if(code===0 || code==="0") return {cls:"c-rest",chip:"chip-rest",label:"休"};
    var s=String(code);
    if(/^x/i.test(s)) return {cls:"c-special",chip:"chip-special",label:s};
    return {cls:"c-work",chip:"chip-work",label:s};
  }
  function renderResult(matches){
    var res=$("result"); res.style.display="block"; res.innerHTML="";
    var firstDate=state.dates.filter(function(d){return d&&!isNaN(d)});
    if(matches.length===0){
      res.innerHTML='<div class="empty">未找到该姓名，请检查是否输错，或换一个关键词（支持模糊匹配）。</div>';
      return;
    }
    var frag=document.createDocumentFragment();
    matches.forEach(function(p){
      var card=document.createElement("div"); card.className="pcard";
      var meta="";
      if(p.group) meta+='<span class="meta">组别：<b>'+p.group+'</b></span>';
      if(p.id) meta+='<span class="meta">工号：<b>'+p.id+'</b></span>';
      var workCount=Object.keys(p.shifts).filter(function(k){return p.shifts[k]!==0 && p.shifts[k]!=="0"}).length;
      var restCount=Object.keys(p.shifts).filter(function(k){return p.shifts[k]===0 || p.shifts[k]==="0"}).length;
      card.innerHTML='<span class="name">'+p.name+'</span>'+meta+
        '<span class="stats">有班 <b>'+workCount+'</b> 天 · 休 <b>'+restCount+'</b> 天</span>';
      frag.appendChild(card);
      var tbl=document.createElement("div"); tbl.className="tbl";
      var sc=document.createElement("div"); sc.className="tbl-scroll";
      var table=document.createElement("table");
      var thead=document.createElement("thead"); var trh=document.createElement("tr");
      trh.innerHTML="<th>日期</th><th>星期</th><th>班次</th>";
      thead.appendChild(trh); table.appendChild(thead);
      var tbody=document.createElement("tbody");
      for(var i=0;i<p.cols.length;i++){
        var key=p.cols[i];
        var d=state.dates[i];
        var code=p.shifts.hasOwnProperty(key)?p.shifts[key]:null;
        var tr=document.createElement("tr");
        var dateTxt=d&&!isNaN(d)?fmtDate(d):"";
        var wdTxt=state.weekdays[i]||"";
        if(code===null||code===undefined){
          // 将 — 修改为未排班
          tr.innerHTML='<td class="date">'+dateTxt+'</td><td>'+wdTxt+'</td><td>未排班</td>';
        }else{
          var rc=renderCellClass(code);
          tr.innerHTML='<td class="date">'+dateTxt+'</td><td>'+wdTxt+'</td>'+
            '<td><span class="chip '+rc.chip+'">'+rc.label+'</span></td>';
        }
        tbody.appendChild(tr);
      }
      table.appendChild(tbody); sc.appendChild(table); tbl.appendChild(sc); frag.appendChild(tbl);
    });
    res.appendChild(frag);
  }
  // ---- 事件 ----
  function doQuery(){
    if(!state.loaded) return;
    var kw=$("kw").value.trim().toLowerCase();
    if(!kw){ renderResult([]); $("result").innerHTML='<div class="empty">请输入姓名。</div>'; return; }
    var matches=state.people.filter(function(p){ return p.name.toLowerCase().indexOf(kw)>=0; });
    renderResult(matches);
  }
  function showDatalist(filter){
    var dl=$("datalist");
    var list=state.people.filter(function(p){ return filter? p.name.toLowerCase().indexOf(filter)>=0 : true; });
    dl.innerHTML="";
    if(list.length>8) list=list.slice(0,8);
    list.forEach(function(p){
      var div=document.createElement("div");
      div.textContent=p.name+"  "+(p.group?"（"+p.group+"）":"");
      div.addEventListener("click",function(){ $("kw").value=p.name; dl.style.display="none"; doQuery(); });
      dl.appendChild(div);
    });
    dl.style.display=list.length?"block":"none";
  }
  function loadFile(file){
    if(!file) return;
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var data=new Uint8Array(e.target.result);
        var wb=XLSX.read(data,{type:"array",cellDates:true});
        var n=parseWorkbook(wb);
        var d0=state.dates[0], d1=state.dates[state.dates.length-1];
        var range=(d0&&!isNaN(d0)&&d1&&!isNaN(d1))? (fmtDate(d0)+" 至 "+fmtDate(d1)) : "";
        var fi=$("fileinfo");
        fi.style.display="block";
        fi.innerHTML='已读取文件 <b>'+file.name+'</b> · 共 <b>'+n+'</b> 人 · '+
          (range?('排班范围 <b>'+range+'</b> · '):'')+state.dates.length+' 天';
        $("query").style.display="block";
        $("hint").textContent="输入姓名后回车或点查询；可输入姓或名的一部分进行模糊匹配。";
        $("kw").focus();
        renderResult([]);
        $("result").innerHTML="";
      }catch(err){
        $("query").style.display="none";
        $("result").style.display="block";
        $("result").innerHTML='<div class="empty">解析失败：'+err.message+'</div>';
      }
    };
    reader.readAsArrayBuffer(file);
  }
  var drop=$("drop"), fi=$("file");
  drop.addEventListener("click",function(){ fi.click(); });
  fi.addEventListener("change",function(){ loadFile(fi.files[0]); });
  ["dragover","dragenter"].forEach(function(ev){
    drop.addEventListener(ev,function(e){ e.preventDefault(); drop.classList.add("dragover"); });
  });
  ["dragleave","drop"].forEach(function(ev){
    drop.addEventListener(ev,function(e){ e.preventDefault(); drop.classList.remove("dragover"); });
  });
  drop.addEventListener("drop",function(e){
    if(e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
  });
  $("btn").addEventListener("click",doQuery);
  $("kw").addEventListener("input",function(){
    var v=this.value.trim().toLowerCase();
    if(v) showDatalist(v); else $("datalist").style.display="none";
  });
  $("kw").addEventListener("keydown",function(e){
    if(e.key==="Enter"){ $("datalist").style.display="none"; doQuery(); }
  });
  document.addEventListener("click",function(e){
    if(!e.target.closest(".box")) $("datalist").style.display="none";
  });
})();
</script>
</body>
</html>
