<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>排班查询 · 上传 Excel 按姓名查排班</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --bg: #f0f4ff;
            --card: #ffffff;
            --border: #e2e8f0;
            --ink: #0f172a;
            --muted: #64748b;
            --primary: #4f6ef7;
            --primary-dark: #3b56d9;
            --primary-light: #e8edff;
            --primary-gradient: linear-gradient(135deg, #4f6ef7, #7c5cfc);
            --shadow: 0 4px 24px rgba(79, 110, 247, 0.12);
            --shadow-hover: 0 8px 40px rgba(79, 110, 247, 0.20);
            --radius: 16px;
            --radius-sm: 10px;
            --work: #2563eb;
            --work-bg: #dbeafe;
            --rest: #dc2626;
            --rest-bg: #fee2e2;
            --special: #7c3aed;
            --special-bg: #ede9fe;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            padding: 0 0 48px;
            min-height: 100vh;
        }
        .wrap {
            max-width: 1080px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }
        .header {
            background: var(--primary-gradient);
            border-radius: var(--radius);
            padding: 24px 20px 20px;
            color: #fff;
            box-shadow: 0 6px 32px rgba(79, 110, 247, 0.30);
            position: relative;
            overflow: hidden;
        }
        .header::after {
            content: "";
            position: absolute;
            right: -40px;
            top: -40px;
            width: 140px;
            height: 140px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
        }
        .header::before {
            content: "";
            position: absolute;
            left: -20px;
            bottom: -60px;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 50%;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 span {
            font-size: 26px;
        }
        .header p {
            font-size: 14px;
            opacity: 0.88;
            margin-top: 4px;
            position: relative;
            z-index: 1;
            font-weight: 400;
        }
        .header .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.20);
            padding: 2px 12px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 500;
            margin-top: 10px;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(4px);
        }
        .drop {
            margin-top: 20px;
            background: var(--card);
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 36px 16px 32px;
            text-align: center;
            cursor: pointer;
            transition: border-color var(--transition), background var(--transition), box-shadow var(--transition);
            box-shadow: var(--shadow);
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }
        .drop:hover,
        .drop.dragover {
            border-color: var(--primary);
            background: var(--primary-light);
            box-shadow: var(--shadow-hover);
        }
        .drop .icon {
            font-size: 42px;
            line-height: 1;
            margin-bottom: 8px;
            display: block;
        }
        .drop .big {
            font-size: 16px;
            font-weight: 600;
            color: var(--ink);
        }
        .drop .small {
            color: var(--muted);
            font-size: 13px;
            margin-top: 4px;
        }
        .drop .small b {
            color: var(--primary);
            font-weight: 600;
        }
        .drop input {
            display: none;
        }

        /* ===== 班次时间映射配置模块 ===== */
        .mapcard {
            margin-top: 20px;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            padding: 18px 16px 14px;
        }
        .mapcard-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .mapcard-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .mapcard-title .icon {
            font-size: 17px;
        }
        .mapcard-desc {
            font-size: 12px;
            color: var(--muted);
            margin-top: 3px;
            line-height: 1.5;
        }

        /* 表头 + 数据行 共用同一 grid 栅格：班次 | 箭头 | 起始 | ~ | 结束 | 删除 */
        .map-grid {
            display: grid;
            grid-template-columns: 62px 14px minmax(0, 1fr) 10px minmax(0, 1fr) 36px;
            gap: 6px;
            align-items: center;
            width: 100%;
        }
        .map-head {
            padding: 0 0 8px;
            font-size: 12px;
            color: var(--muted);
            font-weight: 500;
            letter-spacing: 0.3px;
            border-bottom: 1px solid #eef1f7;
            margin-bottom: 4px;
        }
        .map-head > span {
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .map-rows {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .map-row {
            padding: 4px 2px;
            border-bottom: 1px solid #f1f4f9;
        }
        .map-row:last-child {
            border-bottom: none;
        }

        /* 输入框通用：轻量描边风格 */
        .map-row input {
            width: 100%;
            min-width: 0;
            padding: 7px 6px;
            font-size: 13px;
            border: 1px solid transparent;
            border-radius: 8px;
            background: #f5f7fb;
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
            color: var(--ink);
            height: 38px;
            font-weight: 500;
            text-align: center;
            font-family: inherit;
            font-variant-numeric: tabular-nums;
            -webkit-appearance: none;
            appearance: none;
            -webkit-tap-highlight-color: transparent;
        }
        .map-row input:hover {
            background: #eef1f8;
        }
        .map-row input:focus,
        .map-row input:focus-visible {
            background: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 110, 247, 0.12);
            outline: none !important;
        }

        /* 时间输入框：去掉背景和边框，只留一行淡色数字 */
        .map-row input[type="time"] {
            position: relative;
            cursor: pointer;
            background: transparent;
            border-color: transparent;
            padding: 7px 2px;
            color: #475569;
            text-align: center;
            font-weight: 500;
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
            -webkit-focus-ring-color: transparent;
        }
        .map-row input[type="time"]:hover {
            background: #f5f7fb;
        }
        .map-row input[type="time"]:focus,
        .map-row input[type="time"]:focus-visible,
        .map-row input[type="time"]:active {
            background: #fff;
            border-color: var(--primary);
            outline: none !important;
            box-shadow: 0 0 0 3px rgba(79, 110, 247, 0.12);
            -webkit-tap-highlight-color: transparent;
        }
        .map-row input[type="time"]::-webkit-calendar-picker-indicator {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            opacity: 0;
            cursor: pointer;
            background: transparent;
        }
        .map-row input[type="time"]::-webkit-inner-spin-button {
            display: none;
        }
        .map-row input[type="time"]::-webkit-clear-button {
            display: none;
        }

        /* 班次输入框：透明底，蓝字加粗（只读流水号） */
        .map-row .map-code {
            font-weight: 700;
            color: var(--primary);
            background: transparent;
            border-color: transparent;
            padding: 7px 4px;
            cursor: default;
        }
        .map-row .map-code:hover {
            background: transparent;
        }
        .map-row .map-code:focus,
        .map-row .map-code:focus-visible {
            background: transparent;
            border-color: transparent;
            color: var(--primary);
            outline: none !important;
            box-shadow: none;
        }

        .map-row .map-arrow,
        .map-row .map-tilde {
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            user-select: none;
            line-height: 1;
        }

        /* 删除按钮：轻量灰，悬停红 */
        .map-row .map-del {
            width: 100%;
            height: 38px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--transition), color var(--transition), transform var(--transition);
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .map-row .map-del:hover {
            background: var(--rest-bg);
            color: var(--rest);
        }
        .map-row .map-del:active {
            transform: scale(0.94);
        }
        .map-row .map-del:focus,
        .map-row .map-del:focus-visible {
            outline: none !important;
            box-shadow: none;
        }

        .map-empty {
            color: var(--muted);
            font-size: 13px;
            padding: 14px 12px;
            text-align: center;
            border: 1px dashed var(--border);
            border-radius: var(--radius-sm);
            background: #fafbff;
        }
        .map-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .map-add-btn {
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            border: 2px dashed #c7d2fe;
            background: transparent;
            color: var(--primary);
            font-weight: 600;
            font-size: 13.5px;
            cursor: pointer;
            transition: border-color var(--transition), background var(--transition);
            min-height: 42px;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .map-add-btn:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        .map-add-btn:focus,
        .map-add-btn:focus-visible {
            outline: none !important;
        }
        .map-reset-btn {
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            font-weight: 600;
            font-size: 13.5px;
            cursor: pointer;
            transition: border-color var(--transition), background var(--transition), color var(--transition);
            min-height: 42px;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .map-reset-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }
        .map-reset-btn:focus,
        .map-reset-btn:focus-visible {
            outline: none !important;
        }

        .fileinfo {
            display: none;
            margin-top: 14px;
            background: var(--primary-light);
            border: 1px solid #cdddfb;
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            font-size: 13px;
            line-height: 1.7;
            color: var(--ink);
            box-shadow: var(--shadow);
            animation: fadeUp 0.3s ease;
        }
        .fileinfo b {
            color: var(--primary);
            font-weight: 600;
        }
        .fileinfo .icon-ok {
            color: #16a34a;
            margin-right: 4px;
        }
        .query {
            display: none;
            margin-top: 20px;
        }
        .qbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: stretch;
        }
        .qbar .box {
            flex: 1;
            min-width: 100%;
            position: relative;
        }
        .qbar input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--card);
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
            box-shadow: var(--shadow);
            color: var(--ink);
            font-weight: 500;
            height: 52px;
            -webkit-tap-highlight-color: transparent;
        }
        .qbar input::placeholder {
            color: var(--muted);
            font-weight: 400;
        }
        .qbar input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 110, 247, 0.12), var(--shadow);
            outline: none !important;
        }
        .qbar button {
            width: 100%;
            padding: 0 28px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background: var(--primary-gradient);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: transform var(--transition), box-shadow var(--transition);
            box-shadow: 0 4px 16px rgba(79, 110, 247, 0.30);
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            letter-spacing: 0.3px;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .qbar button:active {
            transform: scale(0.97);
        }
        .qbar button:hover {
            box-shadow: 0 6px 24px rgba(79, 110, 247, 0.40);
        }
        .qbar button .btn-icon {
            font-size: 18px;
        }
        .datalist {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: 0 12px 40px rgba(15, 23, 42, 0.12);
            max-height: 220px;
            overflow: auto;
            display: none;
            z-index: 99;
            padding: 6px 0;
        }
        .datalist div {
            padding: 10px 16px;
            font-size: 14px;
            cursor: pointer;
            min-height: 44px;
            display: flex;
            align-items: center;
            transition: background var(--transition);
            color: var(--ink);
            border-bottom: 1px solid var(--border);
        }
        .datalist div:last-child {
            border-bottom: none;
        }
        .datalist div:hover {
            background: var(--primary-light);
        }
        .datalist div .hint-text {
            color: var(--muted);
            font-size: 12px;
            margin-left: 8px;
        }
        .hint {
            color: var(--muted);
            font-size: 12px;
            margin-top: 8px;
            line-height: 1.5;
            padding-left: 4px;
        }
        .result {
            display: none;
            margin-top: 20px;
            animation: fadeUp 0.35s ease;
        }
        .export-wrap{
            margin:12px 0;
        }
        /* 导出按钮：与「查询」按钮同款渐变、阴影、交互 */
        .export-btn{
            padding:0 28px;
            height:52px;
            border-radius: var(--radius-sm);
            border:none;
            background: var(--primary-gradient);
            color:#fff;
            font-size:16px;
            font-weight:600;
            letter-spacing:0.3px;
            cursor:pointer;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:6px;
            box-shadow: 0 4px 16px rgba(79, 110, 247, 0.30);
            transition: transform var(--transition), box-shadow var(--transition);
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .export-btn:hover{
            box-shadow: 0 6px 24px rgba(79, 110, 247, 0.40);
        }
        .export-btn:active{
            transform: scale(0.97);
        }
        .export-btn:focus,
        .export-btn:focus-visible{
            outline: none !important;
        }
        .export-btn:disabled{
            opacity:0.6;
            cursor:not-allowed;
            transform:none;
            box-shadow: 0 4px 16px rgba(79, 110, 247, 0.30);
        }
        .pcard {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 4px;
            border: 1px solid var(--border);
        }
        .pcard-top {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 16px;
        }
        .pcard .name {
            font-size: 20px;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: 0.3px;
        }
        .pcard .meta {
            color: var(--muted);
            font-size: 13px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
        }
        .pcard .meta b {
            color: var(--ink);
            font-weight: 600;
        }
        .pcard .stats {
            font-size: 13px;
            color: var(--muted);
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .pcard .stats .num {
            font-weight: 700;
            color: var(--ink);
        }
        .pcard .stats .num-work {
            color: var(--work);
        }
        .pcard .stats .num-rest {
            color: var(--rest);
        }
        .shift-list {
            margin-top: 14px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border);
            background: var(--card);
            box-shadow: var(--shadow);
        }
        .shift-item {
            display: grid;
            grid-template-columns: 1.05fr 0.6fr 0.78fr 1.57fr;
            align-items: center;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            transition: background var(--transition);
            gap: 8px;
            text-align: center;
        }
        .shift-item:last-child {
            border-bottom: none;
        }
        .shift-item:nth-child(even) {
            background: #fafbff;
        }
        .shift-header {
            background: #f1f5f9 !important;
            font-weight: 700;
            color: var(--ink);
            border-bottom: 2px solid var(--border);
            font-size: 12.5px;
            letter-spacing: 0.3px;
            padding: 8px 14px;
        }
        .shift-header .s-date,
        .shift-header .s-week,
        .shift-header .s-shift,
        .shift-header .s-time {
            color: var(--ink);
            font-weight: 700;
        }
        .shift-item .s-date,
        .shift-item .s-week,
        .shift-item .s-shift,
        .shift-item .s-time {
            font-weight: 600;
            color: var(--ink);
            font-size: 12.5px;
            text-align: center;
            justify-self: center;
            width: 100%;
        }
        .shift-item .s-time {
            font-weight: 500;
            color: var(--muted);
            font-size: 12px;
            word-break: break-all;
            line-height: 1.35;
        }
        .shift-item .s-week {
            color: var(--ink);
        }
        .shift-item .s-shift .chip {
            display: inline-block;
            padding: 2px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.6;
            letter-spacing: 0.2px;
        }
        .chip-work {
            background: var(--work-bg);
            color: var(--work);
        }
        .chip-rest {
            background: var(--rest-bg);
            color: var(--rest);
        }
        .chip-special {
            background: var(--special-bg);
            color: var(--special);
        }
        .chip-empty {
            background: #f1f5f9;
            color: var(--muted);
            font-weight: 400;
        }
        .shift-table-wrap {
            display: none;
            margin-top: 14px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border);
            background: var(--card);
            box-shadow: var(--shadow);
        }
        .shift-table-wrap table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .shift-table-wrap th,
        .shift-table-wrap td {
            padding: 10px 12px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }
        .shift-table-wrap thead th {
            background: #f1f5f9;
            font-weight: 700;
            color: var(--ink);
            font-size: 12.5px;
            letter-spacing: 0.4px;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 2px solid var(--border);
        }
        .shift-table-wrap tbody tr:nth-child(even) {
            background: #fafbff;
        }
        .shift-table-wrap tbody tr:hover {
            background: var(--primary-light);
        }
        .shift-table-wrap td.date-cell,
        .shift-table-wrap td.week-cell,
        .shift-table-wrap td.shift-cell {
            font-weight: 600;
            color: var(--ink);
            font-size: 12.5px;
            text-align: center;
        }
        .shift-table-wrap td.time-cell {
            font-weight: 500;
            color: #475569;
            font-size: 12.5px;
            text-align: center;
        }
        .shift-table-wrap td.shift-cell .chip {
            display: inline-block;
            padding: 2px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.6;
        }
        .empty {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px 20px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            box-shadow: var(--shadow);
        }
        .empty .empty-icon {
            font-size: 40px;
            display: block;
            margin-bottom: 8px;
        }
        .empty b {
            color: var(--ink);
        }
        .legend {

<body>
<div class="wrap">
    <header class="header">
        <h1><span>📋</span> 排班查询</h1>
        <p>上传排班表（Excel），输入姓名即可查看该员工每天的排班。</p>
        <div class="badge">📁 支持 .xlsx · .xls · .csv</div>
    </header>
    <div class="drop" id="drop">
        <span class="icon">📤</span>
        <div class="big">点击上传，或把 Excel 文件拖到这里</div>
        <div class="small">支持 <b>.xlsx</b> · <b>.xls</b> · <b>.csv</b></div>
        <input type="file" id="file" accept=".xlsx,.xls,.csv" />
    </div>

    <!-- ===== 班次时间映射配置模块 ===== -->
    <div class="mapcard" id="mapcard">
        <div class="mapcard-head">
            <div>
                <div class="mapcard-title"><span class="icon">⏰</span> 班次时间映射</div>
                <div class="mapcard-desc">已按时间表预置 10 条班次，班次号自动生成、无需手填；点时间框选择上下班时间，改完自动保存。若显示的仍是旧数据，点右侧「恢复默认班次」。</div>
            </div>
        </div>

        <div class="map-head map-grid">
            <span>班次</span>
            <span></span>
            <span>起始时间</span>
            <span></span>
            <span>结束时间</span>
            <span></span>
        </div>

        <div class="map-rows" id="mapRows"></div>
        <div class="map-actions">
            <button class="map-add-btn" id="mapAddBtn" type="button">＋ 添加班次</button>
            <button class="map-reset-btn" id="mapResetBtn" type="button">↺ 恢复默认班次</button>
        </div>
    </div>

    <div class="fileinfo" id="fileinfo"></div>
    <div class="query" id="query">
        <div class="qbar">
            <div class="box">
                <input id="kw" type="text" placeholder="输入姓名查询（支持模糊匹配）" autocomplete="off" />
                <div class="datalist" id="datalist"></div>
            </div>
            <button id="btn"><span class="btn-icon">🔍</span> 查询</button>
        </div>
        <div class="hint" id="hint">输入姓名后按回车或点查询；支持姓或名的一部分模糊匹配。</div>
    </div>
    <div class="export-wrap" id="exportWrap" style="display:none;">
        <button class="export-btn" id="exportImgBtn">🖼️ 生成本人员排班图片并下载</button>
    </div>
    <div class="result" id="result"></div>
    <div class="legend" id="legend">
        <span><span class="dot dot-w"></span> 有排班（数字班次）</span>
        <span><span class="dot dot-r"></span> 0（休 / 无班）</span>
<!--        <span><span class="dot dot-s"></span> X 类班次（特殊）</span>-->
    </div>
</div>
<div id="captureContainer"></div>

<script>
    (function() {
        "use strict";

        const CACHE_KEY = 'schedule_cache';
        // 版本号升级 → 旧缓存自动失效
        const MAP_KEY = 'schedule_shift_time_map_v5';

        // 默认班次时间表（班次号 1~10 自动生成）
        const DEFAULT_MAP = [
            { code: '1',  start: '08:00', end: '05:00' },
            { code: '2',  start: '08:00', end: '17:30' },
            { code: '3',  start: '08:15', end: '18:00' },
            { code: '4',  start: '10:00', end: '21:30' },
            { code: '5',  start: '09:00', end: '18:15' },
            { code: '6',  start: '09:30', end: '19:00' },
            { code: '7',  start: '09:45', end: '21:15' },
            { code: '8',  start: '10:15', end: '21:00' },
            { code: '9',  start: '10:00', end: '22:00' },
            { code: '10', start: '09:45', end: '22:00' }
        ];

        var $ = function(id) { return document.getElementById(id); };
        var drop = $('drop');
        var fileInput = $('file');
        var fileInfo = $('fileinfo');
        var queryBox = $('query');
        var kwInput = $('kw');
        var btn = $('btn');
        var datalist = $('datalist');
        var hint = $('hint');
        var resultBox = $('result');
        var exportWrap = $('exportWrap');
        var exportImgBtn = $('exportImgBtn');
        var captureContainer = $('captureContainer');
        var mapRows = $('mapRows');
        var mapAddBtn = $('mapAddBtn');
        var mapResetBtn = $('mapResetBtn');

        var state = {
            people: [],
            dates: [],
            weekdays: [],
            loaded: false,
            lastKeyword: '',
            currentMatchPerson: null,
            shiftMapList: []
        };

        function excelSerialToDate(serial) {
            if (serial instanceof Date) return new Date(serial.getTime());
            if (typeof serial === 'number' && serial > 10000) {
                const utcDays = serial - 25569;
                const ms = utcDays * 86400000;
                const d = new Date(ms);
                return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
            }
            return null;
        }
        function fmtDate(d) {
            if (!d || isNaN(d)) return '';
            var p = function(n) { return n < 10 ? '0' + n : '' + n; };
            return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
        }
        function wdCN(d) {
            return ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
        }
        function normalizeTime(v) {
            if (v === null || v === undefined) return '';
            var s = String(v).trim();
            if (!s) return '';
            var m = s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
            if (!m) return '';
            var hh = parseInt(m[1], 10);
            var mm = parseInt(m[2], 10);
            if (hh < 0 || hh > 23 || mm < 0 || mm > 59) return '';
            return (hh < 10 ? '0' + hh : '' + hh) + ':' + (mm < 10 ? '0' + mm : '' + mm);
        }

        function saveCache() {
            if (!state.loaded) return;
            var cache = {
                people: state.people,
                dates: state.dates.map(function(d) { return d ? d.getTime() : null; }),
                weekdays: state.weekdays,
                lastKeyword: state.lastKeyword || '',
                loaded: true
            };
            try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch (e) { }
        }
        function loadCache() {
            var raw = localStorage.getItem(CACHE_KEY);
            if (!raw) return null;
            try {
                var cache = JSON.parse(raw);
                if (!cache.people || !cache.dates || !cache.weekdays) return null;
                cache.dates = cache.dates.map(function(t) { return t ? new Date(t) : null; });
                return cache;
            } catch (e) { return null; }
        }
        function clearCache() { localStorage.removeItem(CACHE_KEY); }

        // 保存前统一重排班次号：1、2、3……（连续流水号）
        function saveMapCache() {
            state.shiftMapList.forEach(function(item, idx) {
                item.code = String(idx + 1);
            });
            try { localStorage.setItem(MAP_KEY, JSON.stringify(state.shiftMapList)); } catch (e) { }
        }
        function loadMapCache() {
            var raw = localStorage.getItem(MAP_KEY);
            if (raw === null) return null;
            try {
                var arr = JSON.parse(raw);
                if (!Array.isArray(arr)) return null;
                return arr
                    .filter(function(x) { return x && typeof x === 'object'; })
                    .map(function(x) {
                        return {
                            code: x.code == null ? '' : String(x.code),
                            start: normalizeTime(x.start),
                            end: normalizeTime(x.end)
                        };
                    });
            } catch (e) { return null; }
        }

        function makeTimeInput(value, onInput) {
            var input = document.createElement('input');
            input.type = 'time';
            input.step = '60';
            input.value = value || '';
            input.addEventListener('input', onInput);
            input.addEventListener('change', onInput);
            return input;
        }
        function makeText(cls, text) {
            var span = document.createElement('span');
            span.className = cls;
            span.textContent = text;
            span.setAttribute('aria-hidden', 'true');
            return span;
        }

        function renderMapRows() {
            mapRows.innerHTML = '';

            if (!state.shiftMapList.length) {
                saveMapCache();
                var empty = document.createElement('div');
                empty.className = 'map-empty';
                empty.textContent = '还没有配置，点下面「＋ 添加班次」开始';
                mapRows.appendChild(empty);
                return;
            }

            // 渲染前统一重排班次号：1、2、3……
            state.shiftMapList.forEach(function(item, idx) {
                item.code = String(idx + 1);
            });
            saveMapCache();

            state.shiftMapList.forEach(function(item, idx) {
                var row = document.createElement('div');
                row.className = 'map-row map-grid';

                // 班次列：只读流水号，自动生成，不需要手填
                var codeInput = document.createElement('input');
                codeInput.type = 'text';
                codeInput.className = 'map-code';
                codeInput.value = String(idx + 1);
                codeInput.readOnly = true;
                codeInput.tabIndex = -1;
                codeInput.setAttribute('aria-label', '班次号');

                var startInput = makeTimeInput(item.start, function() {
                    state.shiftMapList[idx].start = this.value;
                    saveMapCache();
                    refreshResultIfAny();
                });

                var endInput = makeTimeInput(item.end, function() {
                    state.shiftMapList[idx].end = this.value;
                    saveMapCache();
                    refreshResultIfAny();
                });

                var delBtn = document.createElement('button');
                delBtn.type = 'button';
                delBtn.className = 'map-del';
                delBtn.title = '删除此条';
                delBtn.textContent = '✕';
                delBtn.addEventListener('click', function() {
                    state.shiftMapList.splice(idx, 1);
                    renderMapRows();
                    refreshResultIfAny();
                });

                row.appendChild(codeInput);
                row.appendChild(makeText('map-arrow', '→'));
                row.appendChild(startInput);
                row.appendChild(makeText('map-tilde', '~'));
                row.appendChild(endInput);
                row.appendChild(delBtn);

                mapRows.appendChild(row);
            });
        }

        mapAddBtn.addEventListener('click', function() {
            state.shiftMapList.push({ code: '', start: '', end: '' });
            renderMapRows();

            // 新增后自动聚焦到最后一个“起始时间”
            var timeInputs = mapRows.querySelectorAll('input[type="time"]');
            if (timeInputs.length) timeInputs[timeInputs.length - 1].focus();
        });

        // 恢复默认班次：直接用 DEFAULT_MAP 覆盖并重新渲染
        mapResetBtn.addEventListener('click', function() {
            if (!confirm('确定要恢复为默认的 10 条班次吗？当前自定义的时间会被覆盖。')) return;
            state.shiftMapList = DEFAULT_MAP.map(function(x) {
                return { code: x.code, start: x.start, end: x.end };
            });
            saveMapCache();
            renderMapRows();
            refreshResultIfAny();
        });

        function parseWorkbook(wb) {
            var sheet = wb.Sheets[wb.SheetNames[0]];
            var rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null, raw: true });
            if (!rows || rows.length < 3) throw new Error('表内容为空或行数不足');
            var headIdx = -1, nameCol = -1, groupCol = -1, idCol = -1;
            for (var r = 0; r < Math.min(6, rows.length); r++) {
                var row = rows[r] || [];
                for (var c = 0; c < row.length; c++) {
                    var v = row[c];
                    if (typeof v === 'string' && v.indexOf('姓名') >= 0) { headIdx = r; nameCol = c; }
                    if (typeof v === 'string' && v.indexOf('组别') >= 0) groupCol = c;
                    if (typeof v === 'string' && v.indexOf('工号') >= 0) idCol = c;
                }
                if (headIdx >= 0) break;
            }
            if (headIdx < 0 || nameCol < 0) {
                throw new Error('未找到表头行（缺少“姓名”列）');
            }
            var dateRow = rows[headIdx + 1] || [];
            var headRow = rows[headIdx] || [];
            var cols = [];
            for (var i = 0; i < headRow.length; i++) {
                var h = headRow[i];
                if (typeof h === 'string' && h.indexOf('星期') >= 0) { cols.push(i); }
            }
            if (cols.length === 0) {
                for (var j = nameCol + 1; j < headRow.length; j++) cols.push(j);
            }
            var dates = [], weekdays = [];
            for (var k = 0; k < cols.length; k++) {
                var c2 = cols[k];
                var dv = dateRow[c2];
                var d = excelSerialToDate(dv);
                var wd = null;
                if (typeof headRow[c2] === 'string') {
                    var m = headRow[c2].match(/星期([一二三四五六日])/);
                    if (m) wd = m[1];
                }
                dates.push(d);
                weekdays.push(wd || (d && !isNaN(d) ? wdCN(d) : ''));
            }
            var people = [];
            for (var r2 = headIdx + 2; r2 < rows.length; r2++) {
                var row2 = rows[r2] || [];
                var nm = row2[nameCol];
                if (nm === null || nm === undefined || String(nm).trim() === '') continue;
                var shifts = {};
                for (var ci = 0; ci < cols.length; ci++) {
                    var v2 = row2[cols[ci]];
                    if (v2 === null || v2 === undefined) continue;
                    var key = cols[ci];
                    var val = (typeof v2 === 'number' && v2 % 1 === 0) ? v2 : String(v2).trim();
                    shifts[key] = (val === '0' || val === 0) ? 0 : val;
                }
                people.push({
                    name: String(nm).trim(),
                    group: groupCol >= 0 && row2[groupCol] != null ? String(row2[groupCol]).trim() : '',
                    id: idCol >= 0 && row2[idCol] != null ? String(row2[idCol]).trim() : '',
                    cols: cols.slice(),
                    shifts: shifts
                });
            }
            if (people.length === 0) throw new Error('未解析到任何人员数据');
            state.people = people;
            state.dates = dates;
            state.weekdays = weekdays;
            state.loaded = true;
            return people.length;
        }

        function renderCellClass(code) {
            if (code === 0 || code === '0') {
                return { cls: 'chip-rest', label: '休' };
            }
            var s = String(code);
            if (/^x/i.test(s)) {
                return { cls: 'chip-special', label: s };
            }
            return { cls: 'chip-work', label: s };
        }

        function getShiftTime(code) {
            if (code === null || code === undefined) return '';
            if (code === 0 || code === '0') return '';
            var key = String(code).trim();
            if (key === '' || /^x/i.test(key)) return '';
            for (var i = 0; i < state.shiftMapList.length; i++) {
                var item = state.shiftMapList[i];
                if (String(item.code).trim() === key) {
                    var s = normalizeTime(item.start);
                    var e = normalizeTime(item.end);
                    if (!s && !e) return '';
                    if (s && e) return s + '~' + e;
                    return s || e;
                }
            }
            return '';
        }

        function buildCaptureHtml(person){
            var workCount = Object.keys(person.shifts).filter(function(k) {
                return person.shifts[k] !== 0 && person.shifts[k] !== '0';
            }).length;
            var restCount = Object.keys(person.shifts).filter(function(k) {
                return person.shifts[k] === 0 || person.shifts[k] === '0';
            }).length;

            let metaStr = '';
            if(person.group) metaStr += `<div style="margin:0 8px;">组别：${person.group}</div>`;
            if(person.id) metaStr += `<div style="margin:0 8px;">工号：${person.id}</div>`;

            let tableRows = '';
            for(let i = 0; i < person.cols.length; i++){
                const key = person.cols[i];
                const d = state.dates[i];
                const code = person.shifts.hasOwnProperty(key) ? person.shifts[key] : null;
                const dateTxt = d && !isNaN(d) ? fmtDate(d) : '';
                const wdTxt = state.weekdays[i] || '';

                let shiftHtml = '';
                if (code === null || code === undefined) {
                    shiftHtml = '<span style="display:inline-block;padding:6px 20px;border-radius:999px;background:#f1f5f9;color:#64748b;font-weight:400;font-size:14px;">未排</span>';
                } else {
                    var rc = renderCellClass(code);
                    if(rc.cls === 'chip-rest'){
                        shiftHtml = `<span style="display:inline-block;padding:6px 20px;border-radius:999px;background:#fee2e2;color:#dc2626;font-weight:600;font-size:14px;">${rc.label}</span>`;
                    } else if(rc.cls === 'chip-special'){
                        shiftHtml = `<span style="display:inline-block;padding:6px 20px;border-radius:999px;background:#ede9fe;color:#7c3aed;font-weight:600;font-size:14px;">${rc.label}</span>`;
                    } else {
                        shiftHtml = `<span style="display:inline-block;padding:6px 20px;border-radius:999px;background:#dbeafe;color:#2563eb;font-weight:600;font-size:14px;">${rc.label}</span>`;
                    }
                }

                const timeTxt = getShiftTime(code);

                tableRows += `
                    <tr>
                        <td style="width:24%;text-align:center;padding:16px 10px;font-size:15px;color:#0f172a;border-bottom:1px solid #e2e8f0;">${dateTxt}</td>
                        <td style="width:14%;text-align:center;padding:16px 10px;font-size:15px;color:#0f172a;border-bottom:1px solid #e2e8f0;font-weight:600;">星期${wdTxt}</td>
                        <td style="width:18%;text-align:center;padding:16px 10px;border-bottom:1px solid #e2e8f0;">${shiftHtml}</td>
                        <td style="width:44%;text-align:center;padding:16px 10px;border-bottom:1px solid #e2e8f0;font-size:14px;color:#475569;font-weight:500;">${timeTxt}</td>
                    </tr>
                    `;
            }

            const html = `
                <div style="font-family:'Microsoft YaHei','PingFang SC',system-ui,sans-serif;background:#ffffff;padding:24px 28px 28px;border-radius:16px;max-width:820px;margin:0 auto;">
                    <div style="overflow:hidden;">
                        <h2 style="margin:0 0 6px;font-size:22px;color:#0f172a;font-weight:700;">${person.name} 排班表</h2>
                        <div style="display:flex;flex-wrap:wrap;align-items:center;margin-bottom:18px;font-size:14px;color:#475569;">
                            ${metaStr}
                            <div style="margin:0 8px;">有班 ${workCount} 天，休 ${restCount} 天</div>
                        </div>
                    </div>
                    <table style="width:100%;border-collapse:collapse;table-layout:fixed;">
                        <thead>
                            <tr style="background:#f1f5f9;">
                                <th style="width:24%;text-align:center;padding:16px 10px;font-size:15px;color:#0f172a;font-weight:700;border-bottom:2px solid #e2e8f0;">日期</th>
                                <th style="width:14%;text-align:center;padding:16px 10px;font-size:15px;color:#0f172a;font-weight:700;border-bottom:2px solid #e2e8f0;">星期</th>
                                <th style="width:18%;text-align:center;padding:16px 10px;font-size:15px;color:#0f172a;font-weight:700;border-bottom:2px solid #e2e8f0;">班次</th>
                                <th style="width:44%;text-align:center;padding:16px 10px;font-size:15px;color:#0f172a;font-weight:700;border-bottom:2px solid #e2e8f0;">时间</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                        </tbody>
                    </table>
                    <div style="margin-top:18px;font-size:13px;color:#64748b;display:flex;gap:18px;flex-wrap:wrap;">
                        <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#2563eb;margin-right:6px;vertical-align:middle;"></span>有班</span>
                        <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#dc2626;margin-right:6px;vertical-align:middle;"></span>休</span>
                    </div>
                </div>
                `;
            return html;
        }

        function renderResult(matches) {
            resultBox.style.display = 'block';
            resultBox.innerHTML = '';
            exportWrap.style.display = 'none';
            state.currentMatchPerson = null;
            if (!matches || matches.length === 0) {
                resultBox.innerHTML =
                    '<div class="empty"><span class="empty-icon">🔍</span>未找到该姓名，请检查是否输错，或换一个关键词（支持模糊匹配）。</div>';
                return;
            }
            const p = matches[0];
            state.currentMatchPerson = p;
            exportWrap.style.display = 'block';

            var frag = document.createDocumentFragment();
            var card = document.createElement('div');
            card.className = 'pcard';
            var workCount = Object.keys(p.shifts).filter(function(k) {
                return p.shifts[k] !== 0 && p.shifts[k] !== '0';
            }).length;
            var restCount = Object.keys(p.shifts).filter(function(k) {
                return p.shifts[k] === 0 || p.shifts[k] === '0';
            }).length;
            var metaHtml = '';
            if (p.group) metaHtml += '<span class="meta">组别：<b>' + p.group + '</b></span>';
            if (p.id) metaHtml += '<span class="meta">工号：<b>' + p.id + '</b></span>';
            card.innerHTML =
                '<div class="pcard-top">' +
                '<span class="name">' + p.name + '</span>' +
                metaHtml +
                '<span class="stats">' +
                '有班 <span class="num num-work">' + workCount + '</span> 天 · ' +
                '休 <span class="num num-rest">' + restCount + '</span> 天' +
                '</span>' +
                '</div>';
            frag.appendChild(card);

            var listDiv = document.createElement('div');
            listDiv.className = 'shift-list';
            var headerItem = document.createElement('div');
            headerItem.className = 'shift-item shift-header';
            headerItem.innerHTML =
                '<span class="s-date">日期</span>' +
                '<span class="s-week">星期</span>' +
                '<span class="s-shift">班次</span>' +
                '<span class="s-time">时间</span>';
            listDiv.appendChild(headerItem);
            for (var i = 0; i < p.cols.length; i++) {
                var key = p.cols[i];
                var d = state.dates[i];
                var code = p.shifts.hasOwnProperty(key) ? p.shifts[key] : null;
                var dateTxt = d && !isNaN(d) ? fmtDate(d) : '';
                var wdTxt = state.weekdays[i] || '';
                var item = document.createElement('div');
                item.className = 'shift-item';
                var shiftHtml = '';
                if (code === null || code === undefined) {
                    shiftHtml = '<span class="chip chip-empty">未排</span>';
                } else {
                    var rc = renderCellClass(code);
                    shiftHtml = '<span class="chip ' + rc.cls + '">' + rc.label + '</span>';
                }
                var timeTxt = getShiftTime(code);
                item.innerHTML =
                    '<span class="s-date">' + dateTxt + '</span>' +
                    '<span class="s-week">' + wdTxt + '</span>' +
                    '<span class="s-shift">' + shiftHtml + '</span>' +
                    '<span class="s-time">' + timeTxt + '</span>';
                listDiv.appendChild(item);
            }
            frag.appendChild(listDiv);

            var tableWrap = document.createElement('div');
            tableWrap.className = 'shift-table-wrap';
            var table = document.createElement('table');
            var thead = document.createElement('thead');
            var trh = document.createElement('tr');
            trh.innerHTML = '<th>日期</th><th>星期</th><th>班次</th><th>时间</th>';
            thead.appendChild(trh);
            table.appendChild(thead);
            var tbody = document.createElement('tbody');
            for (var j = 0; j < p.cols.length; j++) {
                var key2 = p.cols[j];
                var d2 = state.dates[j];
                var code2 = p.shifts.hasOwnProperty(key2) ? p.shifts[key2] : null;
                var dateTxt2 = d2 && !isNaN(d2) ? fmtDate(d2) : '';
                var wdTxt2 = state.weekdays[j] || '';
                var tr = document.createElement('tr');
                var shiftHtml2 = '';
                if (code2 === null || code2 === undefined) {
                    shiftHtml2 = '<span class="chip chip-empty">未排</span>';
                } else {
                    var rc2 = renderCellClass(code2);
                    shiftHtml2 = '<span class="chip ' + rc2.cls + '">' + rc2.label + '</span>';
                }
                var timeTxt2 = getShiftTime(code2);
                tr.innerHTML =
                    '<td class="date-cell">' + dateTxt2 + '</td>' +
                    '<td class="week-cell">' + wdTxt2 + '</td>' +
                    '<td class="shift-cell">' + shiftHtml2 + '</td>' +
                    '<td class="time-cell">' + timeTxt2 + '</td>';
                tbody.appendChild(tr);
            }
            table.appendChild(tbody);
            tableWrap.appendChild(table);
            frag.appendChild(tableWrap);
            resultBox.appendChild(frag);
        }

        function refreshResultIfAny() {
            if (!state.loaded || !state.lastKeyword) return;
            var kw = state.lastKeyword;
            var matches = state.people.filter(function(p) {
                return p.name.toLowerCase().indexOf(kw) >= 0;
            });
            renderResult(matches);
        }

        function doQuery() {
            if (!state.loaded) return;
            var kw = kwInput.value.trim().toLowerCase();
            state.lastKeyword = kw;
            if (!kw) {
                renderResult([]);
                resultBox.innerHTML = '<div class="empty"><span class="empty-icon">✏️</span>请输入姓名。</div>';
                saveCache();
                return;
            }
            var matches = state.people.filter(function(p) {
                return p.name.toLowerCase().indexOf(kw) >= 0;
            });
            renderResult(matches);
            saveCache();
        }

        exportImgBtn.onclick = async function(){
            const person = state.currentMatchPerson;
            if(!person){
                alert("请先查询人员！");
                return;
            }
            exportImgBtn.disabled = true;
            exportImgBtn.innerText = "🖼️ 生成中...";
            try{
                captureContainer.innerHTML = buildCaptureHtml(person);
                const canvas = await html2canvas(captureContainer.firstElementChild,{
                    scale:2,
                    useCORS:true,
                    backgroundColor:"#ffffff"
                });
                const link = document.createElement('a');
                link.download = `${person.name}_排班表.png`;
                link.href = canvas.toDataURL("image/png");
                document.body.appendChild(link);
                link.click();
                link.remove();
            }catch(err){
                console.error(err);
                alert("生成图片失败："+err.message);
            }finally{
                captureContainer.innerHTML = '';
                exportImgBtn.disabled = false;
                exportImgBtn.innerText = "🖼️ 生成本人员排班图片并下载";
            }
        };

        function showDatalist(filter) {
            var list = state.people.filter(function(p) {
                return filter ? p.name.toLowerCase().indexOf(filter) >= 0 : true;
            });
            datalist.innerHTML = '';
            if (list.length > 10) list = list.slice(0, 10);
            list.forEach(function(p) {
                var div = document.createElement('div');
                var extra = p.group ? '（' + p.group + '）' : '';
                div.innerHTML = p.name + ' <span class="hint-text">' + extra + '</span>';
                div.addEventListener('click', function() {
                    kwInput.value = p.name;
                    datalist.style.display = 'none';
                    doQuery();
                });
                datalist.appendChild(div);
            });
            datalist.style.display = list.length ? 'block' : 'none';
        }

        function loadFile(file) {
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var data = new Uint8Array(e.target.result);
                    var wb = XLSX.read(data, { type: 'array' });
                    var n = parseWorkbook(wb);
                    var d0 = state.dates[0], d1 = state.dates[state.dates.length - 1];
                    var range = (d0 && !isNaN(d0) && d1 && !isNaN(d1)) ? (fmtDate(d0) + ' 至 ' + fmtDate(d1)) : '';
                    fileInfo.style.display = 'block';
                    fileInfo.innerHTML =
                        '✅ 已读取 <b>' + file.name + '</b> · 共 <b>' + n + '</b> 人 · ' +
                        (range ? '排班范围 <b>' + range + '</b> · ' : '') +
                        state.dates.length + ' 天';
                    queryBox.style.display = 'block';
                    hint.textContent = '输入姓名后按回车或点查询；支持姓或名的一部分模糊匹配。';
                    state.lastKeyword = '';
                    kwInput.value = '';
                    saveCache();
                    resultBox.style.display = 'block';
                    resultBox.innerHTML = '<div class="empty"><span class="empty-icon">👆</span>输入姓名开始查询</div>';
                    kwInput.focus();
                } catch (err) {
                    queryBox.style.display = 'none';
                    resultBox.style.display = 'block';
                    resultBox.innerHTML = '<div class="empty"><span class="empty-icon">❌</span>解析失败：' + err.message + '</div>';
                    clearCache();
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function restoreFromCache() {
            var cache = loadCache();
            if (!cache) return false;
            state.people = cache.people;
            state.dates = cache.dates;
            state.weekdays = cache.weekdays;
            state.loaded = true;
            state.lastKeyword = cache.lastKeyword || '';
            var n = state.people.length;
            var d0 = state.dates[0], d1 = state.dates[state.dates.length - 1];
            var range = (d0 && !isNaN(d0) && d1 && !isNaN(d1)) ? (fmtDate(d0) + ' 至 ' + fmtDate(d1)) : '';
            fileInfo.style.display = 'block';
            fileInfo.innerHTML =
                '💾 已从缓存加载 · 共 <b>' + n + '</b> 人 · ' +
                (range ? '排班范围 <b>' + range + '</b> · ' : '') +
                state.dates.length + ' 天';
            queryBox.style.display = 'block';
            hint.textContent = '输入姓名后按回车或点查询；支持姓或名的一部分模糊匹配。';
            if (state.lastKeyword) {
                kwInput.value = state.lastKeyword;
                doQuery();
            } else {
                resultBox.style.display = 'block';
                resultBox.innerHTML = '<div class="empty"><span class="empty-icon">👆</span>输入姓名开始查询</div>';
            }
            return true;
        }

        function init() {
            // 读取班次缓存（新版本 key=v5，旧缓存自动失效）
            var cachedMap = loadMapCache();

            // 条数不一致（比如只有 1、2 两条）时强制用默认
            if (!cachedMap || cachedMap.length < DEFAULT_MAP.length) {
                state.shiftMapList = DEFAULT_MAP.map(function(x) {
                    return { code: x.code, start: x.start, end: x.end };
                });
                saveMapCache();
            } else {
                state.shiftMapList = cachedMap;
            }

            renderMapRows();

            var restored = restoreFromCache();
            if (!restored) {
                resultBox.style.display = 'block';
                resultBox.innerHTML = '<div class="empty"><span class="empty-icon">📂</span>请上传 Excel 排班表开始查询</div>';
            }

            drop.addEventListener('click', function() { fileInput.click(); });
            fileInput.addEventListener('change', function() { loadFile(fileInput.files[0]); });
            ['dragover', 'dragenter'].forEach(function(ev) {
                drop.addEventListener(ev, function(e) {
                    e.preventDefault();
                    drop.classList.add('dragover');
                });
            });
            ['dragleave', 'drop'].forEach(function(ev) {
                drop.addEventListener(ev, function(e) {
                    e.preventDefault();
                    drop.classList.remove('dragover');
                });
            });
            drop.addEventListener('drop', function(e) {
                if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
            });
            btn.addEventListener('click', doQuery);
            kwInput.addEventListener('input', function() {
                var v = this.value.trim().toLowerCase();
                if (v && state.loaded) showDatalist(v);
                else datalist.style.display = 'none';
            });
            kwInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    datalist.style.display = 'none';
                    doQuery();
                }
            });
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.box')) datalist.style.display = 'none';
            });
            var resizeTimer = null;
            window.addEventListener('resize', function() {
                if (resizeTimer) clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function() {
                    if (state.loaded && state.lastKeyword) {
                        var matches = state.people.filter(function(p) {
                            return p.name.toLowerCase().indexOf(state.lastKeyword) >= 0;
                        });
                        renderResult(matches);
                    }
                    resizeTimer = null;
                }, 200);
            });
        }
        init();
    })();
</script>
</body>
</html>
